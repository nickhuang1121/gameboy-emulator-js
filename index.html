<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裕淵的GB模擬器</title>
    <link rel="canonical" href="https://nickhuang1121.github.io/gameboy-emulator-js/">
    <meta name="description" content="在瀏覽器中遊玩的 Game Boy 模擬器。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nickhuang1121.github.io/gameboy-emulator-js/">
    <meta property="og:title" content="裕淵的GB模擬器">
    <meta property="og:description" content="在瀏覽器中遊玩的 Game Boy 模擬器。">
    <meta property="og:image" content="https://nickhuang1121.github.io/gameboy-emulator-js/images/img_gbemu.jpg">
    <meta property="og:image:width" content="480">
    <meta property="og:image:height" content="360">
    <meta property="og:image:alt" content="裕淵的GB模擬器畫面截圖">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="裕淵的GB模擬器">
    <meta name="twitter:description" content="在瀏覽器中遊玩的 Game Boy 模擬器。">
    <meta name="twitter:image" content="https://nickhuang1121.github.io/gameboy-emulator-js/images/img_gbemu.jpg">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-dmg.css">
    <link rel="stylesheet" href="css/style-mobile.css">
</head>

<body>


    <div class="gameboy">
        <div class="display">
            <div class="display-content">
                <canvas id="bootLogo" width="320" height="288"></canvas>
            </div>

        </div>
        <div class="rom-input"><span>New ROM</span><input id="rom-input" type="file" accept=".gb"></div>

        <div class="joypad" id="joypad">
            <div class="crosspad" id="crosspad">
                <button class="up" data-key="ArrowUp" id="up-button"></button>
                <button class="down" data-key="ArrowDown" id="down-button"></button>
                <button class="right" data-key="ArrowRight" id="right-button"></button>
                <button class="left" data-key="ArrowLeft" id="left-button"></button>
            </div>

            <button class="round-button a-button" data-key="KeyZ" id="a-button">A</button>
            <button class="round-button b-button" data-key="KeyX" id="b-button">B</button>

            <button class="square-button select-button" data-key="ShiftLeft" id="select-button"></button>
            <button class="square-button enter-button" data-key="Enter" id="start-button"></button>

        </div>

    </div>

    <script type="module" src="script/main.js"></script>

</body>

</html>
