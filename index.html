<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裕淵的GB模擬器 Debug Workbench</title>
    <meta name="description" content="Game Boy emulator debug workbench with live CPU registers, opcode trace, mapper state, and input mapping.">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-dmg.css">
    <link rel="stylesheet" href="css/style-mobile.css">
    <link rel="stylesheet" href="css/debug-tools.css">
</head>

<body class="debug-workbench">
    <main class="debug-layout">
        <section class="emulator-stage" aria-label="Game Boy emulator">
            <div class="gameboy">
                <div class="display">
                    <div class="display-content">
                        <canvas id="bootLogo" width="320" height="288"></canvas>
                    </div>
                </div>

                <div class="rom-input">
                    <span>Upload ROM</span>
                    <input id="rom-input" type="file" accept=".gb">
                </div>

                <div class="joypad" id="joypad">
                    <div class="crosspad" id="crosspad">
                        <button class="up" data-key="ArrowUp" id="up-button" aria-label="Up"></button>
                        <button class="down" data-key="ArrowDown" id="down-button" aria-label="Down"></button>
                        <button class="right" data-key="ArrowRight" id="right-button" aria-label="Right"></button>
                        <button class="left" data-key="ArrowLeft" id="left-button" aria-label="Left"></button>
                    </div>

                    <button class="round-button a-button" data-key="KeyZ" id="a-button">A</button>
                    <button class="round-button b-button" data-key="KeyX" id="b-button">B</button>

                    <button class="square-button select-button" data-key="ShiftLeft" id="select-button" aria-label="Select"></button>
                    <button class="square-button enter-button" data-key="Enter" id="start-button" aria-label="Start"></button>
                </div>
            </div>
        </section>

        <aside class="debug-panel" aria-label="Emulator debug panel">
            <header class="debug-panel-header">
                <p class="debug-kicker">DMG DEBUG WORKBENCH</p>
                <h1>暫存器 / Opcode / Input Map</h1>
                <div class="status-strip">
                    <span id="run-state">BOOT</span>
                    <span id="rom-title">book_demo.gb</span>
                </div>
            </header>

            <section class="debug-toolbar" aria-label="Execution controls">
                <button id="pause-toggle" type="button">Pause</button>
                <button id="step-button" type="button" hidden>Step</button>
                <label class="upload-rom-button" for="rom-input">Upload ROM</label>
            </section>

            <section class="debug-section opcode-section">
                <div class="section-title">
                    <h2>目前操作碼</h2>
                    <button id="opcode-log-toggle" type="button" aria-expanded="false">Trace</button>
                </div>
                <div class="opcode-readout">
                    <span id="opcode-value">--</span>
                    <span id="opcode-mnemonic">Waiting for CPU</span>
                    <span id="opcode-pc">PC --</span>
                    <span id="opcode-cycles">-- cycles</span>
                </div>
                <textarea id="opcode-log" class="opcode-log" readonly aria-label="Recent opcode trace"></textarea>
            </section>

            <section class="debug-section">
                <div class="section-title">
                    <h2>8-bit 暫存器</h2>
                </div>
                <div id="register-grid" class="metric-grid metric-grid-4"></div>
            </section>

            <section class="debug-section">
                <div class="section-title">
                    <h2>16-bit / CPU</h2>
                </div>
                <div id="cpu-grid" class="metric-grid metric-grid-3"></div>
            </section>

            <section class="debug-section">
                <div class="section-title">
                    <h2>Flags</h2>
                </div>
                <div id="flag-grid" class="flag-grid"></div>
            </section>

            <section class="debug-section">
                <div class="section-title">
                    <h2>IO / PPU / Timer</h2>
                </div>
                <div id="io-grid" class="metric-grid metric-grid-4"></div>
            </section>

            <section class="debug-section">
                <div class="section-title">
                    <h2>MBC / Cartridge</h2>
                </div>
                <div id="mapper-grid" class="metric-grid metric-grid-3"></div>
            </section>

            <section class="debug-section input-section">
                <div class="section-title">
                    <h2>遊戲映射操作</h2>
                </div>
                <div id="input-map" class="input-map"></div>
            </section>
        </aside>
    </main>

    <script type="module" src="script/debug-main.js"></script>
</body>

</html>
